<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/django_app

    Alias /static /var/www/django_app/static
    <Directory /var/www/django_app/static>
        Require all granted
    </Directory>

    <Directory /var/www/django_app>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    WSGIDaemonProcess django_app python-home=/var/www/django_app/venv python-path=/var/www/django_app
    WSGIProcessGroup django_app
    WSGIScriptAlias / /var/www/django_app/wsgi.py
</VirtualHost>
