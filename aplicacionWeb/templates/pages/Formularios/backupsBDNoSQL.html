{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}
<div class="container mt-5">
    <div id="responseMessage" class="mt-3"></div>
    <h1 class="mb-4">Crear backups</h1>
    <form id="crearBdForm" method="post" action="{% url 'crearBackupNoSQL' %}" class="was-validated">
        {% csrf_token %}
        <div class="row">
            <label for="bd" class="form-label">Base de datos</label>
            <select class="form-select" id="bd" name="bd" required>
                {% for db in dbs %}
                <option value="{{ db.name }}">{{ db.name }}</option>
                {% endfor %}
            </select>
            <div class="mb-3">
                <label for="carpetaMDF" class="form-label">Seleccione una carpeta para el archivo:</label>
                <input type="text" id="carpeta" class="form-control" name="file" placeholder="/var/backups" required>
            </div>
        </div>

        <!-- Botón de enviar formulario -->
        <button type="submit" class="btn btn-primary mt-3" id="submitButton">Crear</button>
    </form>
</div>

<script>
document.getElementById('crearBdForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const form = e.target;
    const submitButton = document.getElementById('submitButton');
    const responseMessage = document.getElementById('responseMessage');
    
    submitButton.disabled = true;
    submitButton.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Procesando...';
    
    fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: {
            'X-Requested-With': 'XMLHttpRequest',
            'X-CSRFToken': form.querySelector('[name=csrfmiddlewaretoken]').value
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            responseMessage.innerHTML = `
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    ${data.message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        } else {
            responseMessage.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    ${data.message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }
    })
    .catch(error => {
        responseMessage.innerHTML = `
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                Error al procesar la solicitud: ${error}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        `;
    })
    .finally(() => {
        submitButton.disabled = false;
        submitButton.innerHTML = 'Crear';
    });
});
</script>
{% endblock %}
