{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}
<div class="container mt-5">
    <div id="responseMessage" class="mt-3"></div>
    <h1 class="mb-4">Exportar Base de Datos</h1>
    <form id="crearBdForm" method="post" action="{% url 'exportarEjecutarNoSQL' %}" class="was-validated">
        {% csrf_token %}
        <div class="row">
            <label for="bd" class="form-label">Base de datos</label>
            <select class="form-select" id="bd" name="bd" required onchange="cargarColecciones()">
                {% for db in dbs %}
                <option value="{{ db.name }}">{{ db.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="row mt-3">
            <label for="colecciones" class="form-label">Colecciones</label>
            <select class="form-select" id="colecciones" name="colecciones" required>
                <!-- Las colecciones se cargarán aquí dinámicamente -->
            </select>
        </div>

        <!-- Botón de enviar formulario -->
        <button type="submit" class="btn btn-primary mt-3" id="submitButton">Descargar</button>
    </form>
</div>

<script>
    function cargarColecciones() {
        let dbName = document.getElementById("bd").value;
        let coleccionesSelect = document.getElementById("colecciones");
        
        // Limpiar opciones anteriores
        coleccionesSelect.innerHTML = "<option>Cargando...</option>";

        fetch(`listaColeccionesNoSQL/${dbName}`)
            .then(response => response.json())
            .then(data => {
                coleccionesSelect.innerHTML = ""; // Limpiar antes de agregar nuevas opciones
                
                // Asegurar que el campo `collections` está presente
                if (data.collections && Array.isArray(data.collections)) {
                    data.collections.forEach(collection => {
                        let option = document.createElement("option");
                        option.value = collection.name;  // Extraer el campo `name`
                        option.textContent = collection.name;
                        coleccionesSelect.appendChild(option);
                    });
                } else {
                    coleccionesSelect.innerHTML = "<option>No se encontraron colecciones</option>";
                }
            })
            .catch(error => {
                console.error("Error obteniendo colecciones:", error);
                coleccionesSelect.innerHTML = "<option>Error al cargar</option>";
            });
    }
</script>
{% endblock %}
